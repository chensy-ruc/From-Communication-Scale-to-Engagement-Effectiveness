[project]
name = "cgtn-es-research"
version = "0.1.0"
description = "Reproducible YouTube collection and audience participation research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "chensy-ruc"}]
keywords = ["youtube", "content-analysis", "reproducible-research", "audience-participation"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27,<0.29",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<0.15",
  "matplotlib>=3.9,<4",
  "langdetect>=1.0.9,<2",
  "python-dotenv>=1.0,<2",
  "patsy>=1.0,<2",
]

[project.scripts]
cgtn = "cgtn.cli:main"

[project.urls]
Repository = "https://github.com/chensy-ruc/From-Communication-Scale-to-Engagement-Effectiveness"
Documentation = "https://github.com/chensy-ruc/From-Communication-Scale-to-Engagement-Effectiveness#readme"
Issues = "https://github.com/chensy-ruc/From-Communication-Scale-to-Engagement-Effectiveness/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgtn"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/README.md", "/LICENSE",
  "/config.toml",
  "/pyproject.toml", "/uv.lock", "/run.py", "/.env.example",
  "/.gitignore", "/.gitattributes", "/.python-version",
  "/data/manifest.json", "/data/study.toml",
  "/data/processed", "/data/inputs", "/data/labels", "/data/checks",
  "/data/reference", "/data/metadata",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]
